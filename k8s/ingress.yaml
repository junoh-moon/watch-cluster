# Admin UI and API ingress with HAProxy basic auth.
#
# Before applying, configure DNS for watch.sixtyfive.me and create the
# credential Secret. Copy the example once, then set ACCOUNT_ID and
# ACCOUNT_PASSWORD in the gitignored local copy (commands use the repo root):
#
#   cp -n k8s/create_account.example.sh k8s/create_account.sh
#   sh k8s/create_account.sh
#
# HAProxy expects one username per Secret key, with a crypt-compatible password
# hash as its value. The script preserves other accounts in the same Secret.
#
# cert-manager uses the existing letsencrypt ClusterIssuer for TLS.
# HTTPS redirect is explicit because the controller's global setting is false.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: watch-cluster
  namespace: watch-cluster
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    flame.pawelmalak/icon: kubernetes
    flame.pawelmalak/name: Watch Cluster
    flame.pawelmalak/type: application
    flame.pawelmalak/url: https://watch.sixtyfive.me
    haproxy.org/auth-type: basic-auth
    haproxy.org/auth-secret: watch-cluster/watch-cluster-basic-auth
    haproxy.org/auth-realm: "watch-cluster admin"
    haproxy.org/ssl-redirect: "true"
    haproxy.org/ssl-redirect-port: "443"
spec:
  ingressClassName: haproxy
  tls:
    - hosts:
        - watch.sixtyfive.me
      secretName: watch-cluster-tls
  rules:
    - host: watch.sixtyfive.me
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: watch-cluster
                port:
                  name: http
