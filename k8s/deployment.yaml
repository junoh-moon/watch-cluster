apiVersion: apps/v1
kind: Deployment
metadata:
  name: watch-cluster
  namespace: watch-cluster
  labels:
    app: watch-cluster
  annotations:
    watch-cluster.io/enabled: "true"
    watch-cluster.io/cron: "* * * * *"  # Every minute
    watch-cluster.io/strategy: "version"

    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: watch-cluster
  template:
    metadata:
      labels:
        app: watch-cluster
    spec:
      serviceAccountName: watch-cluster
      containers:
      - name: watch-cluster
        image: hub.sixtyfive.me/watch-cluster:v0.50.45
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
        # The JVM plus the fabric8 client spends its startup on class loading
        # and Jackson introspection, so a startup probe owns that window and
        # keeps the liveness probe from restarting a pod that is merely slow.
        startupProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 2
          failureThreshold: 60
        readinessProbe:
          httpGet:
            path: /readyz
            port: http
          periodSeconds: 5
          timeoutSeconds: 3
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 30
          timeoutSeconds: 3
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          # Startup is CPU-bound: measured against this cluster, a 200m limit
          # took 52s to bind the HTTP port while 1000m took 8.4s. Steady state
          # is ~3m, so the headroom is only ever consumed while starting, and
          # a runaway is still capped at one of the node's four cores.
          limits:
            memory: "512Mi"
            cpu: "1000m"
        env:
        - name: MINIMUM_RELEASE_AGE_EXCLUDED_REGISTRIES
          valueFrom:
            configMapKeyRef:
              name: watch-cluster-config
              key: MINIMUM_RELEASE_AGE_EXCLUDED_REGISTRIES
              optional: true
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        # Optional bearer-token gate on the admin API. Leave unset to rely on
        # the Ingress alone; set it to also block in-cluster callers that
        # reach the Service directly.
        # - name: ADMIN_TOKEN
        #   valueFrom:
        #     secretKeyRef:
        #       name: watch-cluster-admin
        #       key: token
        - name: WEBHOOK_URL
          valueFrom:
            configMapKeyRef:
              name: watch-cluster-config
              key: WEBHOOK_URL
        - name: WEBHOOK_ENABLE_DEPLOYMENT_DETECTED
          valueFrom:
            configMapKeyRef:
              name: watch-cluster-config
              key: WEBHOOK_ENABLE_DEPLOYMENT_DETECTED
        - name: WEBHOOK_ENABLE_IMAGE_ROLLOUT_STARTED
          valueFrom:
            configMapKeyRef:
              name: watch-cluster-config
              key: WEBHOOK_ENABLE_IMAGE_ROLLOUT_STARTED
        - name: WEBHOOK_ENABLE_IMAGE_ROLLOUT_COMPLETED
          valueFrom:
            configMapKeyRef:
              name: watch-cluster-config
              key: WEBHOOK_ENABLE_IMAGE_ROLLOUT_COMPLETED
        - name: WEBHOOK_ENABLE_IMAGE_ROLLOUT_FAILED
          valueFrom:
            configMapKeyRef:
              name: watch-cluster-config
              key: WEBHOOK_ENABLE_IMAGE_ROLLOUT_FAILED
        - name: WEBHOOK_HEADERS
          valueFrom:
            configMapKeyRef:
              name: watch-cluster-config
              key: WEBHOOK_HEADERS
        - name: WEBHOOK_TIMEOUT
          valueFrom:
            configMapKeyRef:
              name: watch-cluster-config
              key: WEBHOOK_TIMEOUT
        - name: WEBHOOK_RETRY_COUNT
          valueFrom:
            configMapKeyRef:
              name: watch-cluster-config
              key: WEBHOOK_RETRY_COUNT
      imagePullSecrets:
        - name: regcred
